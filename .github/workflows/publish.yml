name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC). No NPM_TOKEN secret is used.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: pnpm install --no-frozen-lockfile

      # `pnpm test` is not run here: src/sdk-contracts.test.ts reads
      # ../../api/openapi/v1.json, which exists only in the BioFlow monorepo
      # this repo is mirrored from.
      - run: pnpm typecheck

      # Trusted publishing requires npm >= 11.5.1; setup-node ships an older npm.
      - run: npm install -g npm@latest

      - run: npm publish --access public
